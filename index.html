<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Everything Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/the-everything-timeline/assets/index-BJTfsN65.js"></script>
  <link rel="stylesheet" crossorigin href="/the-everything-timeline/assets/index-De6PgTjc.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-brand">
        <h1><span class="title-full">The Everything Timeline</span><span class="title-short">Everything Timeline</span></h1>
        <p class="subtitle">From the Big Bang to the age of AI</p>
      </div>
      <p id="active-view-label" class="active-view-label" aria-live="polite">Timeline</p>
    </header>

    <div id="controls">
      <select id="view-select" class="view-select">
        <option value="cosmic">Timeline</option>
        <option value="cosmic-history">Cosmic History</option>
        <option value="civilisations">Civilisations</option>
        <option value="technology">Technology</option>
        <option value="science">Science</option>
        <option value="religion">Religion</option>
        <option value="philosophy">Philosophy</option>
        <option value="art">Art &amp; Culture</option>
        <option value="economics">Economics</option>
        <option value="wars">Wars &amp; Conflicts</option>
        <option value="countries">Countries...</option>
      </select>
      <div id="thumb-bar" class="thumb-bar" aria-label="Zoom and theme controls">
        <div class="zoom-controls">
          <button id="zoom-in" title="Zoom In" type="button">+</button>
          <button id="zoom-out" title="Zoom Out" type="button">&minus;</button>
          <button id="zoom-fit" title="Fit All" type="button">Fit</button>
        </div>
        <button id="theme-toggle" title="Toggle light/dark mode" type="button">🌙</button>
      </div>
      <div id="timeline-search-wrap" class="timeline-search-wrap">
        <input id="timeline-search" class="timeline-search" type="search"
               placeholder="Search this view..." autocomplete="off" spellcheck="false" />
        <div id="timeline-search-results" class="timeline-search-results hidden" role="listbox"></div>
      </div>
      <div id="filters-wrap" class="filters-wrap">
        <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel" title="Filter categories in this view" disabled>
          Filters
          <span id="filters-badge" class="filters-badge hidden" aria-hidden="true"></span>
        </button>
      </div>
      <div id="era-nav"></div>
    </div>

    <div id="filters-panel" class="filters-panel hidden" role="dialog" aria-label="Filter categories" aria-modal="false">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="filters-panel-header">
        <h3 id="filters-title">Filters</h3>
        <button id="filters-close" class="filters-close" type="button" aria-label="Close filters">&times;</button>
      </div>
      <p id="filters-hint" class="filters-hint">Show categories in this view</p>
      <div id="filters-chips" class="filters-chips" role="group" aria-label="Category filters"></div>
      <div class="filters-actions">
        <button id="filters-show-all" class="filters-show-all" type="button">Show all</button>
      </div>
    </div>

    <div id="country-picker" class="country-picker hidden">
      <div class="country-picker-header">
        <input id="country-search" class="country-search" type="search"
               placeholder="Search countries..." autocomplete="off" spellcheck="false" />
        <button id="country-picker-close" class="country-picker-close" aria-label="Close">&times;</button>
      </div>
      <ul id="country-list" class="country-list"></ul>
    </div>

    <div id="timeline-container">
      <canvas id="timeline-canvas"></canvas>
      <div id="tooltip" class="tooltip"></div>
      <div id="gesture-hint" class="gesture-hint hidden" role="status" aria-live="polite">
        <span>Drag to pan · Pinch to zoom · Tap items for details</span>
        <button id="gesture-hint-close" type="button" aria-label="Dismiss gesture hint">&times;</button>
      </div>
    </div>

    <div id="event-detail" class="event-detail hidden">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button id="detail-close" type="button" aria-label="Close details">&times;</button>
      <h2 id="detail-title"></h2>
      <p id="detail-date"></p>
      <p id="detail-description"></p>
      <div id="detail-sources" class="detail-sources hidden" hidden>
        <h3 class="detail-sources-heading">Sources</h3>
        <ul id="detail-sources-list" class="detail-sources-list"></ul>
      </div>
    </div>

    <div id="minimap">
      <canvas id="minimap-canvas"></canvas>
      <div id="minimap-viewport"></div>
    </div>
  </div>

</body>
</html>
